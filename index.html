function rCatForm(){const c=rDraft||STATE.cats.find(c=>c.id===rEditing);const photo=c?.avatarPhoto||null;const preset=(c?.avatarPreset&&Catnu.AVATAR_PRESETS.includes(c.avatarPreset))?c.avatarPreset:Catnu.AVATAR_PRESETS[0];return `<section class="r-card"><h2>${rt(rEditing?'edit':STATE.cats.length?'add':'promise')}</h2><p>${rt(rLoadBlocked?'damaged':'optional')}</p>${rLoadBlocked?`<button data-action="backup">${rt('backup')}</button>`:''}${rLocaleControls()}<form id="r-cat-form"><div class="r-avatar-upload">${rAvatar({name:c?.name||rt('cats'),avatarPhoto:photo,avatarPreset:preset},110)}<input type="file" id="r-avatar-file" accept="image/*" capture="environment" aria-label="${rt('changePhoto')}"><span class="r-avatar-edit" aria-hidden="true">📷</span></div><p>${rt('avatarPhoto')}</p>${!photo?`<small>${rt('startAvatar')}</small><div class="r-avatar-presets" role="group" aria-label="${rt('startAvatar')}">${Catnu.AVATAR_PRESETS.map(p=>`<button type="button" class="r-avatar-preset ${preset===p?'selected':''}" data-preset="${p}" aria-label="${p}"><img src="images/avatars/cat-avatar-${p}.png" alt=""></button>`).join('')}</div>`:''}<label>${rt('name')}<input name="name" required maxlength="40" value="${esc(c?.name||'')}" autocomplete="off"></label><fieldset><legend>${rt('impression')}</legend>${['social','playful','quiet','independent'].map(k=>`<label class="r-check"><input type="checkbox" name="traits" value="${k}" ${c?.ownerPerception.includes(k)?'checked':''}>${rt(k)}</label>`).join('')}</fieldset><details><summary>${rt('details')}</summary><label>${rt('birthday')}<input type="date" name="birthDate" value="${esc(c?.birthDate||'')}"></label><label>${rt('home')}<input type="date" name="homeDate" value="${esc(c?.homeDate||'')}"></label></details><button class="r-primary">${rt(rEditing?'save':'start')}</button>${STATE.cats.length?`<button type="button" data-action="cancel">${rt('cancel')}</button>`:''}</form>${!STATE.cats.length?`<label>${rt('restore')}<input id="r-restore" type="file" accept="application/json"></label>`:''}</section>`;}
function rMomentForm(){return `<section class="r-card"><h2>${rt('moment')}</h2><form id="r-moment"><label>${rt('note')}<textarea name="note" maxlength="500"></textarea></label><label>${rt('photo')}<input type="file" name="photo" accept="image/*" capture="environment"></label><fieldset><legend>${rt('linked')}</legend>${STATE.cats.map(c=>`<label class="r-check"><input type="checkbox" name="cats" value="${esc(c.id)}" ${rActive==='all'||rActive===c.id?'checked':''}>${esc(c.name)}</label>`).join('')}</fieldset><button class="r-primary">${rt('save')}</button></form></section>`;}
function rToday(){const cat=Catnu.dailyCat(STATE,todayStr());const answered=STATE.observations.some(o=>o.date===todayStr());const question=Catnu.dailyQuestion(STATE,todayStr());return `<section class="r-hero"><span class="r-kicker">${rt(STATE.cats.length>1?'family':'promise')}</span>${rActive==='all'&&STATE.cats.length>1?`<div class="r-family-art">${STATE.cats.map(c=>rAvatar(c,85)).join('')}</div>`:rAvatar(STATE.cats.find(c=>c.id===rActive)||cat)}<h2>${rActive==='all'&&STATE.cats.length>1?rt('family'):esc((STATE.cats.find(c=>c.id===rActive)||cat).name)}</h2><p>${rt('question')} · ${esc(cat.name)}</p><button data-action="blink">${rt('blink')}</button></section>${rRecapBanner?`<button type="button" class="backup-nudge" data-recap-open><span>📖</span><div>${esc(rt('recapReady').replace('{month}',rRecapMonthLabel(rRecapBanner.monthKey,STATE.settings.locale)))}<small>${rt('recapSub')}</small></div></button>`:''}${rLogWidget(rActive!=='all'?rActive:cat.id)}${rFactPending?`<section class="r-card" id="r-fact-card"><h2 style="font-size:16px">${rt('factTitle')}</h2><p>${esc(rFactPending.fact)}</p><button type="button" data-fact-dismiss>${rt('factDismiss')}</button></section>`:''}<section class="r-card"><p>${rt('rotate')}</p><h2>${rt(answered?'done':{'quiet-approach':'ask','toy-interest':'playAsk','settle-rest':'restAsk'}[question])}</h2>${answered?'':`<div class="r-answer">${['yes','no','skip'].map(k=>`<button data-answer="${k}">${rt(k==='no'&&question!=='quiet-approach'?'notToday':k)}</button>`).join('')}</div>`}</section>${rMomentForm()}`;}
function rMemories(){const moments=STATE.moments.filter(m=>rActive==='all'||m.catIds.includes(rActive));return `${rMomentForm()}${moments.slice().reverse().map(m=>{const asset=STATE.assets.find(a=>a.id===m.assetId);return `<article class="r-card">${asset&&/^data:image\/(jpeg|png|webp);base64,/.test(asset.data)?`<img class="r-photo" src="${esc(asset.data)}" alt="${esc(m.note)}">`:''}<p>${esc(m.note)}</p><small>${esc(m.date)} · ${m.catIds.map(id=>esc(STATE.cats.find(c=>c.id===id)?.name||'')).join(' · ')}</small></article>`;}).join('')||`<section class="r-hero">${rAvatar(STATE.cats[0])}<p>${rt('empty')}</p></section>`}<section class="r-card"><h2>${rt('legacy')}</h2>${STATE.logs.filter(l=>rActive==='all'||l.catId===rActive).slice().reverse().slice(0,rHistoryLimit).map(l=>`<p>${esc(l.note||l.notes||'')} <span>${esc([...(l.actions||[]),...(l.reactions||[])].map(id=>copyRows[id]?rt(id):STATE.customActions?.find(a=>a.id===id)?.label||id).join(' · '))}</span><small>${esc(new Date(l.ts||l.timestamp||Date.now()).toLocaleDateString(STATE.settings.locale))}</small></p>`).join('')}<small>${STATE.logs.length}</small>${STATE.logs.length>rHistoryLimit?`<button data-action="more">${rt('more')}</button>`:''}</section>`;}
function rCatAnalysis(cat){const now=Date.now();const affection=Catnu.affectionScore(STATE.logs,cat.id,now);const level=affection.insufficient?null:Catnu.relationshipLevel(affection.score);const story=Catnu.weeklyStory(STATE.logs,cat.id,now);const insights=Catnu.generateInsights(STATE.logs,cat,now);return `<div class="minicard"><div><div class="mlbl">${rt('affectionLabel')}</div><span class="mnum">${affection.insufficient?'--':affection.score}</span></div><div class="mheart">💗</div></div><div class="meter"><div style="width:${affection.insufficient?0:affection.score}%"></div></div>${affection.insufficient?`<div class="mlbl" style="margin-top:8px">${rt('affectionInsufficient')}</div>`:(level?`<div class="lvl-line">🏅 Lv.${level.lv} <b>${esc(level.title)}</b> ${level.emoji}<span class="lvl-next">${level.next?`仲差 ${level.next.pointsNeeded} 分升 Lv.${level.next.lv}「${esc(level.next.title)}」`:'頂級！繼續寵佢 👑'}</span></div>`:'')}${renderWeeklyStoryCard(STATE,cat,story)}<div class="r-card" style="margin:12px 0 0;padding:14px"><h2 style="font-size:15px;margin:0 0 8px">${rt('insightsHeading')}</h2>${insights.length?insights.map(i=>`<div class="insight"><span>${insightIcon(i)}</span><span>${mdBold(i.text)}</span></div>`).join(''):`<div class="note">${rt('insightsEmpty')}</div>`}</div>${(()=>{const signal=Catnu.recentSignal(STATE.logs,cat.id,now);return signal?`<div class="r-card" style="margin:12px 0 0;padding:14px"><h2 style="font-size:15px;margin:0 0 6px">${rt('signalTitle')}</h2><p style="margin:0">${esc(signal.message)}</p><small>${rt('signalDisclaimer')}</small></div>`:'';})()}${rTimelineBlock(cat)}`;}
function rCats(){return `${renderMilestoneWall(STATE)}${rFactsWall()}<p>${rt('compare')}</p>${STATE.cats.filter(c=>rActive==='all'||c.id===rActive).map(c=>{const i=Catnu.insight(STATE,c.id);return `<article class="r-card r-profile" data-cat-id="${esc(c.id)}">${rAvatar(c)}<h2>${esc(c.name)}</h2><p>${rt('original')} · ${c.ownerPerception.map(rt).join(' / ')||rt('pending')}</p><p>${rt('observed')} · ${i.revised?rt('revised'):Catnu.observedTraits(STATE,c.id).map(t=>rt(t.trait)).join(' / ')||rt('pending')}</p>${rCatAnalysis(c)}<small>${rt('confidence')}: ${rt(i.confidence)} (${i.count})</small>${i.count?`<p>${rt('feedback')}</p><div class="r-answer">${['accurate','unsure','inaccurate'].map(k=>`<button data-feedback="${k}" data-id="${esc(c.id)}">${rt(k)}</button>`).join('')}</div>`:''}<details><summary>${rt('history')}</summary>${STATE.observations.filter(o=>o.catId===c.id).slice(-5).reverse().map(o=>`<p><small>${esc(o.date)} · ${rt({'quiet-approach':'ask','toy-interest':'playAsk','settle-rest':'restAsk'}[o.question]||'ask')} · ${rt(o.answer==='no'?'notToday':o.answer)}</small></p>`).join('')}</details><button data-edit="${esc(c.id)}">${rt('edit')}</button></article>`;}).join('')}${STATE.cats.length>1?`<section class="r-card"><h2>${rt('relationship')}</h2><form id="r-relation"><div class="r-fields">${['first','second'].map((k,i)=>`<select name="${k}" aria-label="${rt('cats')} ${i+1}">${STATE.cats.map((c,j)=>`<option value="${esc(c.id)}" ${j===i?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`).join('')}</div><select name="kind">${rOptions(['together','space'],'together')}</select><button>${rt('save')}</button></form>${STATE.relationships.map(r=>`<p>${r.catIds.map(id=>esc(STATE.cats.find(c=>c.id===id)?.name||'')).join(' + ')} · ${rt(r.kind)}</p>`).join('')}</section>`:''}<button class="r-primary" data-action="add">${rt('add')}</button>`;}
Catnu.getDemoPicks=(state,catId)=>{
 const household=catId==='all';const insight=household?null:Catnu.insight(state,catId);

 try{STATE.cats.forEach(c=>{c.observedTraits=Catnu.observedTraits(STATE,c.id);c.observationConfidence=Catnu.insight(STATE,c.id).confidence;});Catnu.Store.save(STATE);rPersisted=JSON.stringify(STATE);return true;}
 catch(e){if(rPersisted)STATE=JSON.parse(rPersisted);Catnu.showToast(rt('error'));return false;}

function rRender(){document.documentElement.lang=STATE.settings.locale;document.title=rt('brand');const app=document.getElementById('app');app.className='r-app';app.innerHTML=`<header class="r-header"><strong>${rt('brand')}</strong>${STATE.cats.length?`<span style="display:flex;align-items:center;gap:8px"><span class="r-streak">🔥 ${STATE.streak.current}</span><button data-tab="settings" aria-label="${rt('settings')}">⚙</button></span>`:''}</header>${!STATE.cats.length||rAdding||rEditing?rCatForm():`<div class="r-switch" aria-label="${rt('cats')}">${STATE.cats.length>1?`<button data-cat="all" class="${rActive==='all'?'selected':''}">${rt('family')}</button>`:''}${STATE.cats.map(c=>`<button data-cat="${esc(c.id)}" class="${rActive===c.id?'selected':''}">${rAvatar(c,36)}${esc(c.name)}</button>`).join('')}</div><main>${({today:rToday,memories:rMemories,cats:rCats,picks:rPicks,settings:rSettings}[rTab])()}</main><nav class="r-nav">${['today','memories','cats','picks'].map((k,i)=>`<button data-tab="${k}" aria-current="${rTab===k?'page':'false'}"><span aria-hidden="true">${['☀','▧','♡','✧'][i]}</span>${rt(k)}</button>`).join('')}</nav>`}<div id="toast" class="toast" role="status"></div>`;
app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{rTab=b.dataset.tab;rRender();});app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{rActive=b.dataset.cat;rRender();});
const locale=app.querySelector('#r-locale');if(locale)locale.onchange=()=>{rCaptureDraft();STATE.settings.locale=locale.value;STATE.settings.localeChosen=true;if(rSave())rRender();};const region=app.querySelector('#r-region');if(region)region.onchange=()=>{rCaptureDraft();STATE.settings.region=region.value;if(!STATE.cats.length&&!STATE.settings.localeChosen)STATE.settings.locale={HK:'zh-HK',TW:'zh-TW',CN:'zh-CN',OTHER:'en'}[region.value];if(rSave())rRender();};
app.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(b.dataset.action==='more'){rHistoryLimit+=20;rRender();}if(b.dataset.action==='blink')Catnu.showToast(rt('blinkDone'));if(b.dataset.action==='add'){rAdding=true;rDraft=null;rRender();}if(b.dataset.action==='cancel'){rAdding=false;rEditing=null;rDraft=null;rRender();}if(b.dataset.action==='backup')rBackup();});
app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{rEditing=b.dataset.edit;rDraft=null;rRender();});
const form=app.querySelector('#r-cat-form');if(form)form.onsubmit=e=>{e.preventDefault();const f=new FormData(form);const name=String(f.get('name')).trim();if(!name)return;let c=STATE.cats.find(c=>c.id===rEditing);const avatarPhoto=(rDraft&&rDraft.avatarPhoto!==undefined)?rDraft.avatarPhoto:(c?.avatarPhoto||null);const avatarPreset=(rDraft&&rDraft.avatarPreset!==undefined)?rDraft.avatarPreset:(c?.avatarPreset||null);if(!c){c={id:'c'+Date.now(),breedId:'mixed',emoji:'🐱',anniversaries:[]};STATE.cats.push(c);}Object.assign(c,{name,avatarPhoto,avatarPreset,birthDate:f.get('birthDate')||'',homeDate:f.get('homeDate')||'',ownerPerception:f.getAll('traits')});if(rSave()){rAdding=false;rEditing=null;rDraft=null;rActive=c.id;rRender();}};
const avatarFile=app.querySelector('#r-avatar-file');if(avatarFile)avatarFile.onchange=async()=>{const file=avatarFile.files[0];if(!file)return;try{if(!file.type.startsWith('image/')||file.size>15000000)throw Error('photo');rCaptureDraft();rDraft.avatarPhoto=await rCropSquare(file);rRender();}catch(e){Catnu.showToast(rt('error'));}};
app.querySelectorAll('.r-avatar-preset').forEach(b=>b.onclick=()=>{rCaptureDraft();rDraft.avatarPreset=b.dataset.preset;rRender();});
app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(STATE.observations.some(o=>o.date===todayStr()))return;STATE.observations.push({catId:Catnu.dailyCat(STATE,todayStr()).id,date:todayStr(),answer:b.dataset.answer,question:Catnu.dailyQuestion(STATE,todayStr())});if(rSave()){rRender();Catnu.showToast(rt('saved'));}});
app.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>{STATE.insightFeedback.push({catId:b.dataset.id,answer:b.dataset.feedback,ts:Date.now()});if(rSave()){rRender();Catnu.showToast(rt('saved'));}});
app.querySelectorAll('[data-log-preset]').forEach(b=>b.onclick=()=>{const p=QUICK_PRESETS[+b.dataset.logPreset];rCommitLog({catId:b.dataset.logCat,reactions:p.reactions,actions:p.actions,neg:p.neg},b);});
const logToggle=app.querySelector('[data-log-detail-toggle]');if(logToggle)logToggle.onclick=()=>{rLogDetailOpen=!rLogDetailOpen;rRender();};
app.querySelectorAll('[data-log-reaction]').forEach(c=>c.onclick=()=>{const id=c.dataset.logReaction;rLogReactions.has(id)?rLogReactions.delete(id):rLogReactions.add(id);rRender();});
app.querySelectorAll('[data-log-action]').forEach(c=>c.onclick=()=>{const id=c.dataset.logAction;rLogActions.has(id)?rLogActions.delete(id):rLogActions.add(id);rRender();});
const logSubmit=app.querySelector('[data-log-submit]');if(logSubmit)logSubmit.onclick=()=>{const entry={catId:logSubmit.dataset.logCat,reactions:[...rLogReactions],actions:[...rLogActions]};rLogReactions=new Set();rLogActions=new Set();rLogDetailOpen=false;rCommitLog(entry,logSubmit);};
app.querySelectorAll('.r-profile').forEach(art=>{const catId=art.dataset.catId;const shareBtn=art.querySelector('#weekly-share');if(shareBtn)shareBtn.onclick=()=>{const cat=STATE.cats.find(c=>c.id===catId);Catnu.shareWeeklyCard(STATE,cat,Catnu.weeklyReport(STATE.logs,catId,Date.now()));};});
const factDismiss=app.querySelector('[data-fact-dismiss]');if(factDismiss)factDismiss.onclick=()=>{rFactPending=null;rRender();};
const recapOpenBtn=app.querySelector('[data-recap-open]');if(recapOpenBtn)recapOpenBtn.onclick=()=>rRecapOpen();
const relation=app.querySelector('#r-relation');if(relation)relation.onsubmit=e=>{e.preventDefault();const f=new FormData(relation);if(f.get('first')===f.get('second'))return;STATE.relationships.push({catIds:[f.get('first'),f.get('second')],kind:f.get('kind'),date:todayStr()});if(rSave())rRender();};
const mf=app.querySelector('#r-moment');if(mf)mf.onsubmit=async e=>{e.preventDefault();const f=new FormData(mf);const ids=f.getAll('cats');const note=String(f.get('note')).trim();const file=f.get('photo');if(!ids.length||(!note&&!file?.size))return;const button=mf.querySelector('button');button.disabled=true;try{let asset=null;if(file?.size){if(!file.type.startsWith('image/')||file.size>15000000)throw Error('photo');asset={id:'a'+Date.now(),data:await rPhoto(file)};STATE.assets.push(asset);}const moment={id:'m'+Date.now(),catIds:ids,assetId:asset?.id||null,note,date:todayStr()};STATE.moments.push(moment);if(!rSave())return;rTab='memories';rRender();}catch(err){Catnu.showToast(rt('error'));}finally{button.disabled=false;}};
const restore=app.querySelector('#r-restore');if(restore)restore.onchange=async()=>{try{const parsed=JSON.parse(await restore.files[0].text());if(!Catnu.validateBackup(parsed))throw Error('schema');const s=Catnu.migrateState(parsed);if(!s)throw Error('schema');rRestorePreview(s);}catch(e){Catnu.showToast(rt('error'));}};
}
function rBackup(){
 if(!rLoadBlocked){STATE.settings.lastBackupAt=Date.now();rSave();}
 const json=rLoadBlocked?rOriginalRaw:JSON.stringify(STATE,null,2);
 const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
 const dialog=document.createElement('dialog');dialog.className='r-dialog';dialog.setAttribute('aria-labelledby','r-backup-title');
 dialog.innerHTML=`<h2 id="r-backup-title">${rt('ready')}</h2><a class="r-download" href="${url}" download="catnu-backup-${todayStr()}.json">${rt('download')}</a><details><summary>${rt('manual')}</summary><textarea readonly aria-label="${rt('backup')}">${esc(json)}</textarea></details><button>${rt('close')}</button>`;
 document.getElementById('app').appendChild(dialog);dialog.querySelector('button').onclick=()=>dialog.close();dialog.onclose=()=>{URL.revokeObjectURL(url);dialog.remove();};dialog.showModal();
}
function rRestorePreview(state){
 const dialog=document.createElement('dialog');dialog.className='r-dialog';dialog.setAttribute('aria-labelledby','r-restore-title');
 dialog.innerHTML=`<h2 id="r-restore-title">${rt('restore')}</h2><p>${rt('restoreCounts')}: ${state.cats.length} / ${state.logs.length} / ${state.moments.length}</p><p>${rt('confirmRestore')}</p><div class="r-answer"><button id="r-confirm-cancel">${rt('cancel')}</button><button id="r-confirm-save" class="r-primary">${rt('confirm')}</button></div>`;
 document.getElementById('app').appendChild(dialog);dialog.querySelector('#r-confirm-cancel').onclick=()=>dialog.close();dialog.onclose=()=>dialog.remove();dialog.querySelector('#r-confirm-save').onclick=()=>{try{Catnu.Store.save(state);STATE=state;rLoadBlocked=false;rPersisted=JSON.stringify(state);rActive=state.cats.length===1?state.cats[0].id:'all';dialog.close();rRender();}catch(e){Catnu.showToast(rt('error'));}};dialog.showModal();
}
function rPhoto(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{try{const scale=Math.min(1,1280/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.8));}catch(e){reject(e);}finally{URL.revokeObjectURL(url);}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('image'));};img.src=url;});}
function rCropSquare(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{try{const side=Math.min(img.width,img.height);const sx=(img.width-side)/2,sy=(img.height-side)/2;const size=Math.min(320,side);const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;canvas.getContext('2d').drawImage(img,sx,sy,side,side,0,0,size,size);resolve(canvas.toDataURL('image/jpeg',.85));}catch(e){reject(e);}finally{URL.revokeObjectURL(url);}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('image'));};img.src=url;});}
Catnu.validateBackup = parsed => {
 if(!parsed||![1,2].includes(parsed.schemaVersion)||!Array.isArray(parsed.cats)||!Array.isArray(parsed.logs))return false;
 if(parsed.cats.some(c=>!c||typeof c.id!=='string'||typeof c.name!=='string'))return false;
 const ids=new Set(parsed.cats.map(c=>c.id));if(ids.size!==parsed.cats.length)return false;
 for(const key of ['moments','assets','observations','insightFeedback','relationships'])if(parsed[key]!==undefined&&!Array.isArray(parsed[key]))return false;
 const assets=parsed.assets||[];const assetIds=new Set(assets.map(a=>a?.id));if(assetIds.size!==assets.length||assets.some(a=>!a||typeof a.id!=='string'||typeof a.data!=='string'||!/^data:image\/(jpeg|png|webp);base64,/.test(a.data)))return false;
 if((parsed.moments||[]).some(m=>!m||!Array.isArray(m.catIds)||!m.catIds.length||m.catIds.some(id=>!ids.has(id))||(m.assetId&&!assetIds.has(m.assetId))))return false;
 if((parsed.observations||[]).some(o=>!o||!ids.has(o.catId)||!['yes','no','skip'].includes(o.answer)))return false;
 if((parsed.insightFeedback||[]).some(f=>!f||!ids.has(f.catId)||!['accurate','unsure','inaccurate'].includes(f.answer)))return false;
 if((parsed.relationships||[]).some(r=>!r||!Array.isArray(r.catIds)||r.catIds.length!==2||r.catIds[0]===r.catIds[1]||r.catIds.some(id=>!ids.has(id))||!['together','space'].includes(r.kind)))return false;
 return true;
};
function rCaptureDraft(){const form=document.getElementById('r-cat-form');if(!form)return;const f=new FormData(form);const existing=rEditing?STATE.cats.find(c=>c.id===rEditing):null;const avatarPhoto=(rDraft&&rDraft.avatarPhoto!==undefined)?rDraft.avatarPhoto:(existing?.avatarPhoto||null);const avatarPreset=(rDraft&&rDraft.avatarPreset!==undefined)?rDraft.avatarPreset:(existing?.avatarPreset||null);rDraft={name:f.get('name'),avatarPhoto,avatarPreset,ownerPerception:f.getAll('traits'),birthDate:f.get('birthDate')||'',homeDate:f.get('homeDate')||''};}
function initRedesign(){rOriginalRaw=localStorage.getItem(STORAGE_KEY);if(rOriginalRaw){try{const parsed=JSON.parse(rOriginalRaw);rLoadBlocked=!Catnu.validateBackup(parsed)||!Catnu.migrateState(parsed);}catch(e){rLoadBlocked=true;}}STATE=Catnu.prepareRedesign(rLoadBlocked?defaultState():Catnu.Store.load());if(!rLoadBlocked){const unlocked=Catnu.checkNewMilestones(STATE,Date.now());if(unlocked.length){STATE.milestones.push(...unlocked);Catnu.Store.save(STATE);}if(STATE.cats.length){rRecapBanner=checkMonthlyRecap(STATE);if(rRecapBanner)Catnu.Store.save(STATE);}}rPersisted=JSON.stringify(STATE);rActive=STATE.cats.length===1?STATE.cats[0].id:'all';rRender();}

window.addEventListener('DOMContentLoaded', initRedesign);
})();
