<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFE7D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="貓奴修行">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>貓奴修行</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23FFE7D6'/%3E%3Cg fill='%23E0754F'%3E%3Ccircle cx='50' cy='58' r='20'/%3E%3Ccircle cx='24' cy='30' r='11'/%3E%3Ccircle cx='50' cy='20' r='11'/%3E%3Ccircle cx='76' cy='30' r='11'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23FFE7D6'/%3E%3Cg fill='%23E0754F'%3E%3Ccircle cx='50' cy='58' r='20'/%3E%3Ccircle cx='24' cy='30' r='11'/%3E%3Ccircle cx='50' cy='20' r='11'/%3E%3Ccircle cx='76' cy='30' r='11'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Fraunces:ital,wght@1,600;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF4EA; --paper:#FFFDFA;
  --teal:#E89B6B; --teal-dk:#7A4A38; --night:#5C4638;
  --terra:#E0754F; --mustard:#FFD09A; --rose:#D9BCE4;
  --ink:#5C4638; --sub:#A98D7C; --line:#F3E3D3;
  --peach-1:#FFE7D6; --peach-2:#FFD3BE; --purple:#7B4E8E;
  --sans:'M PLUS Rounded 1c','Noto Sans TC',sans-serif; --serif:'M PLUS Rounded 1c','Noto Sans TC',sans-serif; --disp:'Fraunces',serif;
  --clay-card:0 8px 18px rgba(122,74,56,.12), inset 0 2px 0 rgba(255,255,255,.95), inset 0 -5px 9px rgba(214,148,110,.14);
  --clay-card-sm:0 4px 10px rgba(122,74,56,.1), inset 0 2px 0 rgba(255,255,255,.9), inset 0 -3px 6px rgba(214,148,110,.12);
  --clay-sel:0 8px 16px rgba(224,117,79,.26), inset 0 2px 0 rgba(255,255,255,.85), inset 0 -5px 9px rgba(193,94,55,.2);
  --clay-amber:0 8px 16px rgba(224,150,60,.28), inset 0 2px 0 rgba(255,255,255,.9), inset 0 -5px 9px rgba(200,130,40,.2);
  --clay-pressed:0 2px 6px rgba(122,74,56,.12), inset 0 2px 0 rgba(255,255,255,.6), inset 0 -2px 4px rgba(214,148,110,.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100%}
body{font-family:var(--sans);color:var(--ink);background:linear-gradient(180deg,#F6E3D3,#EFD2BE);display:flex;justify-content:center}
h1,h2,h3{font-family:var(--serif)}
button{font-family:inherit;border:none;background:none;cursor:pointer}
input,select{font-family:inherit}
.app{width:100%;max-width:430px;min-height:100vh;background:var(--cream);position:relative;overflow-x:hidden}
/* @CSS:TABS */
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-5px) rotate(4deg)}}
@keyframes squish{0%{transform:scale(1)}40%{transform:scale(.88,.94)}70%{transform:scale(1.05,1.02)}100%{transform:scale(1)}}
@keyframes fly{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.25) rotate(var(--r));opacity:0}}
.squish{animation:squish .32s cubic-bezier(.34,1.56,.64,1)}
.burst{position:fixed;font-size:22px;pointer-events:none;z-index:60;animation:fly 1s ease-out forwards}
.press{transition:transform .12s cubic-bezier(.34,1.56,.64,1),box-shadow .12s}
.press:active{transform:translateY(3px) scale(.965)!important;box-shadow:var(--clay-pressed)!important}
.quest{display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;margin-bottom:10px;background:linear-gradient(180deg,var(--paper),#FFF3E9);box-shadow:var(--clay-card-sm);cursor:pointer;transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
.quest:active{transform:translateY(2px) scale(.98)}
.quest.done{background:linear-gradient(180deg,#F0F7EE,#E2EEDD);opacity:.9}
.quest .box{width:28px;height:28px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;background:#FFEBDD;box-shadow:inset 0 2px 4px rgba(180,110,80,.2);color:var(--terra)}
.quest.done .box{background:linear-gradient(180deg,#9DC98A,#7DB56A);color:#fff;box-shadow:0 3px 8px rgba(125,181,106,.4),inset 0 2px 0 rgba(255,255,255,.5)}
.quest .q{flex:1;font-size:13px;line-height:1.45;font-weight:500}
.quest .q small{display:block;color:var(--sub);font-size:11px;margin-top:2px;font-weight:500}
.tag{font-size:10px;background:var(--mustard);border-radius:99px;padding:2px 9px;font-weight:800;margin-left:6px;vertical-align:middle;color:#8A5A2B;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 3px rgba(200,130,40,.2)}
.milestone{border-radius:22px;padding:16px;text-align:center;background:linear-gradient(160deg,var(--paper) 55%,#FFF0E2);box-shadow:var(--clay-card)}
.milestone .big{font-size:32px;display:inline-block;animation:floaty 3.4s ease-in-out infinite}
.milestone b{display:block;font-size:14px;margin-top:4px;font-weight:800}
.milestone small{color:var(--sub);font-size:11px;font-weight:500}
.milestone .share{margin-top:8px;font-size:11.5px;color:var(--terra);font-weight:800;cursor:pointer}
.cat-row{display:flex;align-items:center;gap:12px}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,#FFE2B8,#FFD09A);display:flex;align-items:center;justify-content:center;font-size:25px;flex:none;box-shadow:0 5px 12px rgba(224,150,60,.3),inset 0 2px 0 rgba(255,255,255,.8),inset 0 -4px 7px rgba(200,130,40,.2)}
.cat-meta{flex:1}
.cat-meta .name{font-weight:800;font-size:15px}
.cat-meta .breed{font-size:11px;color:var(--sub);font-weight:500}
.score .num{font-size:30px;font-weight:900;color:var(--terra);font-family:var(--disp);font-style:italic}
.score .lbl{font-size:10px;color:var(--sub);text-align:right;font-weight:700}
.meter{height:13px;background:#FFE9DA;border-radius:99px;margin-top:10px;overflow:hidden;box-shadow:inset 0 3px 6px rgba(180,110,80,.16)}
.meter>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#FFCB86,#F9A87C,#EE7E4F);box-shadow:inset 0 -3px 5px rgba(170,70,30,.22);transition:width .8s cubic-bezier(.34,1.3,.64,1)}
.minibars{display:flex;gap:5px;align-items:flex-end;height:42px;margin-top:12px}
.minibars .bar{flex:1;background:var(--line);border-radius:6px 6px 3px 3px;min-height:3px}
.minibars .bar.pos{background:linear-gradient(180deg,#FFCB86,#F5B15C);box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.minibars .bar.neg{background:linear-gradient(180deg,#E3CBEC,#D0AEDF);box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.insight{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.55}
.insight:last-child{border-bottom:none}
.empty-state{text-align:center;padding:40px 20px;color:var(--sub);font-weight:500}
.empty-state .big{font-size:44px;margin-bottom:12px;display:inline-block;animation:floaty 3s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(122,74,56,.2))}
.accordion-cat{margin-bottom:14px}
.accordion-cat > .cat-title{font-weight:800;color:var(--terra);font-size:13px;margin-bottom:6px;letter-spacing:1px}
.decode{padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.decode:last-child{border-bottom:none}
.decode-head{display:flex;gap:10px;align-items:center;cursor:pointer}
.decode-head .ico{font-size:20px;width:26px;text-align:center;flex:none}
.decode-head b{flex:1;color:var(--teal-dk);font-weight:700}
.decode-body{padding:6px 0 0 36px;color:var(--sub);font-size:12px;line-height:1.6;display:none}
.decode-body.open{display:block}
.trait-bar{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:7px}
.trait-bar .t{width:78px;color:var(--sub);flex:none;font-weight:600}
.trait-bar .m{flex:1;height:9px;background:#FFEDE0;border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(180,110,80,.15)}
.trait-bar .m>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#F5B98F,#E89B6B)}
.breed-card{border-radius:20px;padding:14px;margin-bottom:10px;background:linear-gradient(180deg,var(--paper),#FFF3E9);box-shadow:var(--clay-card-sm)}
.breed-card .bh{display:flex;align-items:center;gap:10px;cursor:pointer}
.breed-card .bh .emoji{font-size:23px}
.breed-card .bh .name{font-weight:800;flex:1;font-size:14px}
.breed-card .bd{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;line-height:1.7;color:var(--sub)}
.breed-card .bd.open{display:block}
.breed-card .pitfall{color:var(--terra)}
.breed-card ul{margin:4px 0 4px 18px}
.quiz-entry{display:flex;gap:10px}
.quiz-entry .qe{flex:1;text-align:center;border-radius:20px;padding:14px 8px;font-size:12px;background:linear-gradient(180deg,var(--paper),#FFF3E9);cursor:pointer;box-shadow:var(--clay-card-sm);line-height:1.5;font-weight:700;transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
.quiz-entry .qe:active{transform:translateY(2px) scale(.97)}
.quiz-entry .qe span{font-size:22px;display:block;margin-bottom:4px}
.quiz-overlay{position:fixed;inset:0;background:rgba(92,70,56,.6);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.quiz-panel{background:var(--cream);width:100%;max-width:430px;max-height:85vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:20px;position:relative;box-shadow:0 -10px 34px rgba(0,0,0,.25)}
.quiz-panel h3{margin:6px 0 12px}
.quiz-close{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;background:linear-gradient(180deg,#fff,#FFF1E4);font-size:14px;cursor:pointer;box-shadow:var(--clay-card-sm);color:var(--teal-dk);font-weight:800}
.quiz-panel .chips{flex-direction:column}
.quiz-panel .chips .chip{width:100%;text-align:left}
.field{margin-bottom:14px}
.field label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px;font-weight:700}
.field input,.field select{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:14px;background:var(--paper);font-size:14px;color:var(--ink)}
.field input:focus,.field select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(232,155,107,.18)}
.milestone-wall{display:flex;flex-wrap:wrap;gap:8px}
.milestone-wall .chip.locked{opacity:.38}
.danger-btn{color:var(--terra);font-size:12px;font-weight:800;cursor:pointer;margin-top:8px;display:inline-block}
.tilehead{position:relative;padding:20px 18px 16px;color:var(--teal-dk);background:linear-gradient(150deg,var(--peach-1) 0%,var(--peach-2) 100%);overflow:hidden}
.tilehead::before{content:"🐾";position:absolute;right:-8px;bottom:-20px;font-size:80px;opacity:.13;transform:rotate(-16deg)}
.tilehead h1{font-size:20px;position:relative;letter-spacing:1px;display:flex;align-items:center;gap:9px;font-weight:800}
.tilehead .mascot{display:inline-block;font-size:28px;animation:floaty 3.2s ease-in-out infinite;filter:drop-shadow(0 7px 5px rgba(122,74,56,.26))}
.tilehead .streak{position:absolute;right:14px;top:16px;background:linear-gradient(180deg,#fff,#FFF1E4);border-radius:99px;padding:6px 13px;text-align:center;color:var(--terra);box-shadow:0 6px 14px rgba(224,117,79,.26),inset 0 2px 0 #fff,inset 0 -3px 6px rgba(224,117,79,.12)}
.tilehead .streak b{display:block;font-size:14px;line-height:1.15;font-weight:800}
.tilehead .streak span{font-size:8px;letter-spacing:1.5px;font-weight:800}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:406px;z-index:20;display:flex;padding:8px;margin-bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(255,253,250,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:26px;box-shadow:0 12px 30px rgba(122,74,56,.22),inset 0 2px 0 #fff}
@media (max-width:430px){.tabs{width:calc(100% - 24px)}}
.tab{flex:1;text-align:center;padding:7px 0 5px;font-size:10.5px;color:#B99C8C;cursor:pointer;border-radius:18px;font-weight:800;transition:all .15s}
.tab i{display:block;font-style:normal;font-size:19px;margin-bottom:1px;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.tab.active{color:#8A5A2B;background:linear-gradient(180deg,#FFE2B8,#FFD09A);box-shadow:0 6px 12px rgba(224,150,60,.26),inset 0 2px 0 rgba(255,255,255,.9),inset 0 -4px 7px rgba(200,130,40,.18)}
.tab.active i{transform:scale(1.18) translateY(-1px)}
.page{display:none;padding:16px;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.page.active{display:block}
.card{background:linear-gradient(180deg,var(--paper) 0%,#FFF3E9 100%);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--clay-card)}
.card h3{font-size:14px;margin:0 0 10px;color:var(--teal-dk);letter-spacing:.5px;font-weight:800}
.card h3 .deco{color:var(--terra)}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{background:linear-gradient(180deg,#fff,#FFF3E9);border-radius:99px;padding:9px 14px;font-size:13px;cursor:pointer;user-select:none;box-shadow:var(--clay-card-sm);font-weight:700;color:#6B4F3F;transition:transform .12s cubic-bezier(.34,1.56,.64,1),box-shadow .12s}
.chip:active{transform:translateY(2px) scale(.96);box-shadow:var(--clay-pressed)}
.chip.sel{background:linear-gradient(180deg,#FBD9C9,#F7BFA6);color:#A14E2E;font-weight:800;box-shadow:var(--clay-sel)}
.chip.neg.sel{background:linear-gradient(180deg,#E9D5EF,#D9BCE4);color:var(--purple);box-shadow:0 8px 16px rgba(150,100,180,.22),inset 0 2px 0 rgba(255,255,255,.85),inset 0 -5px 9px rgba(120,70,150,.18)}
.chip.act.sel{background:linear-gradient(180deg,#D9EDD2,#BFDDB4);color:#3E7A2E;box-shadow:0 8px 16px rgba(125,181,106,.25),inset 0 2px 0 rgba(255,255,255,.85),inset 0 -5px 9px rgba(90,140,70,.18)}
.switcher{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.switcher .chip{flex:1;text-align:center;min-width:90px;padding:11px 8px;font-weight:800;font-size:14px}
.switcher .chip.sel{background:linear-gradient(180deg,#FFE2B8,#FFD09A);color:#8A5A2B;box-shadow:var(--clay-amber)}
.btn{width:100%;background:linear-gradient(180deg,#F9A87C 0%,#EE7E4F 100%);color:#fff;border-radius:22px;padding:14px;font-size:15.5px;font-weight:800;margin-top:14px;cursor:pointer;box-shadow:0 10px 22px rgba(224,117,79,.38),inset 0 3px 0 rgba(255,255,255,.45),inset 0 -6px 10px rgba(170,70,30,.26);letter-spacing:1px;transition:transform .12s cubic-bezier(.34,1.56,.64,1),box-shadow .12s}
.btn:active{transform:translateY(3px) scale(.975);box-shadow:0 4px 10px rgba(224,117,79,.35),inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 6px rgba(170,70,30,.2)}
.btn.ghost{background:linear-gradient(180deg,#fff,#FFF3E9);color:var(--ink);box-shadow:var(--clay-card-sm)}
.btn.ghost:active{box-shadow:var(--clay-pressed)}
.note{font-size:11px;color:var(--sub);background:#FFF0E4;border-radius:14px;padding:10px 12px;margin-top:10px;line-height:1.65;font-weight:500;box-shadow:inset 0 2px 4px rgba(180,110,80,.08)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,140%);background:var(--night);color:#FFF3E8;padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:800;z-index:50;transition:transform .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 10px 24px rgba(0,0,0,.28);max-width:80vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
/* 一撳即記 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:13px 12px;border-radius:22px;cursor:pointer;text-align:left;background:linear-gradient(180deg,var(--paper),#FFF3E9);box-shadow:var(--clay-card);transition:transform .12s cubic-bezier(.34,1.56,.64,1),box-shadow .12s}
.tile:active{transform:translateY(3px) scale(.965);box-shadow:var(--clay-pressed)}
.tile .em{font-size:25px;display:block;margin-bottom:5px}
.tile .t{font-size:13.5px;font-weight:800;color:#6B4F3F;line-height:1.35}
.tile .s{font-size:10px;font-weight:700;color:#C9A78F;margin-top:2px}
.tile.negt{background:linear-gradient(180deg,#FBF7FF,#F0E6F7);box-shadow:0 8px 18px rgba(120,80,150,.13),inset 0 2px 0 rgba(255,255,255,.95),inset 0 -5px 9px rgba(150,110,190,.14)}
.tile.negt .t{color:var(--purple)}
.repeat-btn{margin-top:12px;width:100%;padding:12px;border-radius:99px;font-size:13.5px;font-weight:800;color:#A14E2E;cursor:pointer;background:linear-gradient(180deg,#FBD9C9,#F7BFA6);box-shadow:var(--clay-sel);transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
.repeat-btn:active{transform:translateY(2px) scale(.98)}
.detail-toggle{margin-top:12px;width:100%;padding:9px;font-size:13px;font-weight:800;color:#B99C8C;cursor:pointer;background:none}
.detail-wrap{display:none}
.detail-wrap.open{display:block;animation:slidein .3s ease}
@keyframes slidein{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.night{background:linear-gradient(135deg,#6D5A8C,#8E77B5);color:#FFF4E8;border-radius:20px;padding:13px 16px;font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:11px;margin-bottom:14px;cursor:pointer;box-shadow:0 8px 18px rgba(109,90,140,.32),inset 0 2px 0 rgba(255,255,255,.22),inset 0 -5px 9px rgba(60,45,90,.28);transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
.night:active{transform:translateY(2px) scale(.98)}
.night .moon{font-size:22px}
.night small{display:block;font-weight:600;font-size:11.5px;opacity:.85}
.minicard{display:flex;align-items:center;gap:12px}
.minicard .mnum{font-family:var(--disp);font-style:italic;font-size:34px;font-weight:900;color:var(--terra);line-height:1}
.minicard .mlbl{font-size:11.5px;color:var(--sub);font-weight:700}
.minicard .mheart{margin-left:auto;font-size:28px;filter:drop-shadow(0 5px 4px rgba(224,117,79,.3))}
/* 關係等級 */
.lvl-line{margin-top:10px;font-size:12.5px;font-weight:800;color:#8A6A55;background:#FFF1E4;border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:7px;box-shadow:inset 0 2px 4px rgba(180,110,80,.08)}
.lvl-line b{color:var(--terra)}
.lvl-line .lvl-next{margin-left:auto;color:#C9A78F;font-weight:700;font-size:11.5px}
/* 貓咪週報 */
.wk-grid{display:flex;gap:10px}
.wk-cell{flex:1;text-align:center;background:#FFF1E4;border-radius:16px;padding:12px 6px;box-shadow:inset 0 2px 4px rgba(180,110,80,.08)}
.wk-cell b{display:block;font-family:var(--disp);font-style:italic;font-size:22px;font-weight:900;color:var(--terra);line-height:1.3}
.wk-cell span{font-size:10.5px;font-weight:700;color:var(--sub)}
/* 紀念日 */
.celebrate{background:linear-gradient(135deg,#FFD98A,#F7B45C);color:#7A4A20;border-radius:20px;padding:14px 16px;font-size:14px;font-weight:800;margin-bottom:14px;cursor:pointer;box-shadow:0 8px 18px rgba(230,160,60,.35),inset 0 2px 0 rgba(255,255,255,.5),inset 0 -5px 9px rgba(180,110,30,.22);transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
.celebrate:active{transform:translateY(2px) scale(.98)}
.celebrate small{display:block;font-weight:700;font-size:11.5px;opacity:.75;margin-top:2px}
.anni-badge{background:#FFF1E4;color:#8A6A55;border-radius:99px;padding:8px 14px;font-size:12px;font-weight:800;margin-bottom:12px;text-align:center;box-shadow:inset 0 2px 4px rgba(180,110,80,.1)}
.anni-box{margin-top:10px;background:#FFF1E4;border-radius:16px;padding:11px 13px;box-shadow:inset 0 2px 4px rgba(180,110,80,.08)}
.anni-days{font-size:13px;font-weight:800;color:#8A6A55}

    next: nxt ? { lv: nxt.lv, title: nxt.title, pointsNeeded: nxt.min - score } : null,
  };
};

/* @LOGIC:ANNIVERSARY — 紀念日／相處日數 */
Catnu.daysTogether = function daysTogether(homeDate, nowTs) {
  if (!homeDate) return null;
  const start = new Date(homeDate + 'T00:00:00').getTime();
  if (Number.isNaN(start) || start > nowTs) return null;
  return Math.floor((nowTs - start) / 86400000) + 1;
};

// cat: { birthDate?, homeDate?, anniversaries?: [{id,label,emoji,date}] }
// 回傳按 daysUntil 排序嘅 [{key,label,emoji,date:'YYYY-MM-DD',daysUntil,years}]
// birthYM（淨係年月）唔夠精度做倒數，只用完整日期欄位。
Catnu.upcomingAnniversaries = function upcomingAnniversaries(cat, nowTs) {
  const now = new Date(nowTs); now.setHours(0, 0, 0, 0);
  const out = [];
  const pad = (n) => String(n).padStart(2, '0');
  function push(key, label, emoji, baseDateStr) {
    if (!baseDateStr) return;
    const base = new Date(baseDateStr + 'T00:00:00');
    if (Number.isNaN(base.getTime())) return;
    let occ = new Date(now.getFullYear(), base.getMonth(), base.getDate());
    if (occ < now) occ = new Date(now.getFullYear() + 1, base.getMonth(), base.getDate());
    out.push({
      key, label, emoji,
      date: `${occ.getFullYear()}-${pad(occ.getMonth() + 1)}-${pad(occ.getDate())}`,
      daysUntil: Math.round((occ - now) / 86400000),
      years: occ.getFullYear() - base.getFullYear(),
    });
  }
  push('birthday', '生日', '🎂', cat.birthDate);
  push('gotcha', '嚟屋企紀念日', '🏠', cat.homeDate);
  (cat.anniversaries || []).forEach(a => push('custom-' + a.id, a.label, a.emoji || '💗', a.date));
  return out.sort((a, b) => a.daysUntil - b.daysUntil);
};

/* @LOGIC:WEEKLY — 貓咪週報 */
Catnu.weeklyReport = function weeklyReport(logs, catId, nowTs) {
  function windowStats(offsetDays) {
    const end = nowTs - offsetDays * 86400000;
    const start = end - 7 * 86400000;
    const entries = logs.filter(l => l.catId === catId && l.ts > start && l.ts <= end);
    let pos = 0, neg = 0;
    const actionCount = {};
    entries.forEach(l => {
      let p = 0;
      (l.reactions || []).forEach(r => { p += Catnu.REACTION_POLARITY[r] || 0; });
      if (p > 0) pos++; else if (p < 0) neg++;
      (l.actions || []).forEach(a => { actionCount[a] = (actionCount[a] || 0) + 1; });
    });
    const nonNeutral = pos + neg;
    let topAction = null, topN = 0;
    Object.entries(actionCount).forEach(([a, n]) => { if (n > topN) { topAction = a; topN = n; } });
    return {
      count: entries.length,
      posRate: nonNeutral ? Math.round(100 * pos / nonNeutral) : null,
      topAction, topActionCount: topN,
    };
  }
  const thisWeek = windowStats(0);
  const lastWeek = windowStats(7);
  return {
    count: thisWeek.count, posRate: thisWeek.posRate,
    topAction: thisWeek.topAction, topActionCount: thisWeek.topActionCount,
    prevCount: lastWeek.count, prevPosRate: lastWeek.posRate,
    posRateChange: (thisWeek.posRate !== null && lastWeek.posRate !== null) ? thisWeek.posRate - lastWeek.posRate : null,
  };
};

/* @LOGIC:MIGRATE — schema version-dispatch（v1 → v2 加 birthDate＋anniversaries）*/
Catnu.migrateState = function migrateState(parsed) {
  if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.cats)) return null;
  if (parsed.schemaVersion === 1) parsed.schemaVersion = 2;
  if (parsed.schemaVersion !== 2) return null;
  parsed.cats.forEach(c => {
    if (typeof c.birthDate !== 'string') c.birthDate = '';
    if (!Array.isArray(c.anniversaries)) c.anniversaries = [];
  });
  return parsed;
};

/* @LOGIC:ENGINE */
const DAY_MS = 86400000;
const DECAY = 0.85;

Catnu.entryPolarity = function entryPolarity(entry) {
  let pos = 0, neg = 0;
  for (const rid of (entry.reactions || [])) {
    const p = Catnu.REACTION_POLARITY[rid];
    if (p === 1) pos++; else if (p === -1) neg++;
  }
  if (pos > neg) return 'positive';
  if (neg > pos) return 'negative';
  return 'neutral';
};

function weightedWindowScore(logs, catId, nowTs, windowStartDaysAgo, windowEndDaysAgo) {
  let num = 0, den = 0, nonNeutralCount = 0;
  for (const entry of logs) {
    if (entry.catId !== catId) continue;
    const daysAgo = Math.floor((nowTs - entry.ts) / DAY_MS);
    if (daysAgo < windowStartDaysAgo || daysAgo > windowEndDaysAgo) continue;
    const polarity = Catnu.entryPolarity(entry);
    if (polarity === 'neutral') continue;
    nonNeutralCount++;
    const w = Math.pow(DECAY, daysAgo);
    den += w;
    if (polarity === 'positive') num += w;
  }
  if (nonNeutralCount < 5) return { score: null, insufficient: true };
  return { score: Math.round((100 * num) / den), insufficient: false };
}

Catnu.affectionScore = function affectionScore(logs, catId, nowTs) {
  const current = weightedWindowScore(logs, catId, nowTs, 0, 6);
  const previous = weightedWindowScore(logs, catId, nowTs, 7, 13);
  const weekChange = (!current.insufficient && !previous.insufficient)
    ? current.score - previous.score
    : null;
  return { score: current.score, insufficient: current.insufficient, weekChange };
};

Catnu.actionCorrelation = function actionCorrelation(logs, catId, actionId, nowTs) {
  const catLogs = logs.filter(e => e.catId === catId);
  const actionEntries = catLogs.filter(e => (e.actions || []).includes(actionId));
  const n = actionEntries.length;

  const THIRTY_MIN = 30 * 60000;
  const sample = [];
  for (const a of actionEntries) {
    if (!sample.includes(a)) sample.push(a);
    for (const e of catLogs) {
      if (e !== a && e.ts > a.ts && e.ts - a.ts <= THIRTY_MIN && !sample.includes(e)) {
        sample.push(e);
      }
    }
  }
  let samplePos = 0, sampleNeg = 0;
  for (const e of sample) {
    const p = Catnu.entryPolarity(e);
    if (p === 'positive') samplePos++; else if (p === 'negative') sampleNeg++;
  }
  const sampleNonNeutral = samplePos + sampleNeg;
  const P_a = sampleNonNeutral > 0 ? samplePos / sampleNonNeutral : null;

  let basePos = 0, baseNeg = 0;
  for (const e of catLogs) {
    const p = Catnu.entryPolarity(e);
    if (p === 'positive') basePos++; else if (p === 'negative') baseNeg++;
  }
  const baseNonNeutral = basePos + baseNeg;
  const P_base = baseNonNeutral > 0 ? basePos / baseNonNeutral : null;

  const NEG_IDS = ['flatears', 'walkaway', 'hiss', 'bite'];
  const negativeCount = actionEntries.filter(e =>
    (e.reactions || []).some(r => NEG_IDS.includes(r))
  ).length;
  const negativeRate = n > 0 ? negativeCount / n : 0;

  const insufficientData = n >= 1 && n < 5;
  const positiveFinding = n >= 5 && P_a !== null && P_base !== null && (P_a - P_base) >= 0.15;
  const negativeWarning = n >= 5 && negativeRate >= 0.6;

  return { n, P_a, P_base, negativeCount, negativeRate, insufficientData, positiveFinding, negativeWarning };
};

Catnu.generateInsights = function generateInsights(logs, cat, nowTs) {
  const breed = Catnu.BREEDS.find(b => b.id === cat.breedId);
  const positives = [], negatives = [], notes = [];

  for (const action of Catnu.ACTIONS) {
    const r = Catnu.actionCorrelation(logs, cat.id, action.id, nowTs);
    if (r.positiveFinding) {
      let text = `**${action.label}後 30 分鐘**正面反應率 ${formatPct(r.P_a)}%（平時 ${formatPct(r.P_base)}%）——${POSITIVE_TIPS[action.id] || '呢個係你哋之間嘅黃金公式，不妨保持！'}`;
      const rule = breed && breed.breedRules.find(x => x.when === 'positiveFinding' && x.action === action.id);
      if (rule) text += ` ${rule.text}`;
      positives.push({ type: 'positive', actionId: action.id, text });
    } else if (r.negativeWarning) {
      let text = `**${action.label}** ${r.n} 次有 ${r.negativeCount} 次負面反應——${NEGATIVE_TIPS[action.id] || '留意佢嘅即時反應，減少呢個動作嘅頻率。'}`;
      const rule = breed && breed.breedRules.find(x => x.when === 'negativeWarning' && x.action === action.id);
      if (rule) text += ` ${rule.text}`;
      negatives.push({ type: 'negative', actionId: action.id, text });
    } else if (r.insufficientData) {
      notes.push({ type: 'insufficient', actionId: action.id, text: `${action.label} 記錄得 ${r.n} 次，未夠數據——今晚試多次？` });
    }
  }

  if (breed) {
    for (const rule of breed.breedRules) {
      if (rule.when !== 'noRecentAction') continue;
      const last = logs
        .filter(e => e.catId === cat.id && (e.actions || []).includes(rule.action))
        .reduce((max, e) => Math.max(max, e.ts), -Infinity);
      const daysSince = last === -Infinity ? Infinity : (nowTs - last) / DAY_MS;
      if (daysSince >= rule.days) notes.push({ type: 'insufficient', actionId: rule.action, text: rule.text });
    }
  }

  return [...positives, ...negatives, ...notes].slice(0, 5);
};

function dateStrToDays(s) {
  const [y, m, d] = s.split('-').map(Number);
  return Math.floor(Date.UTC(y, m - 1, d) / DAY_MS);
}

Catnu.checkStreakBreak = function checkStreakBreak(streak, todayStr) {
  if (!streak.lastDoneDate) return { ...streak };
  const diff = dateStrToDays(todayStr) - dateStrToDays(streak.lastDoneDate);
  if (diff >= 2) return { ...streak, current: 0 };
  return { ...streak };
};

Catnu.completeQuestsForDay = function completeQuestsForDay(streak, todayStr) {
  if (streak.lastDoneDate === todayStr) return { ...streak };
  const current = streak.current + 1;
  return { current, best: Math.max(streak.best, current), lastDoneDate: todayStr };
};

Catnu.checkNewMilestones = function checkNewMilestones(state, nowTs) {
  const unlocked = new Set(state.milestones.map(m => `${m.id}:${m.catId || ''}`));
  const found = [];

  for (const cat of state.cats) {
    for (const def of Catnu.MILESTONE_DEFS) {
      const key = `${def.id}:${cat.id}`;
      if (unlocked.has(key)) continue;
      if (def.check(state.logs, cat.id)) found.push({ id: def.id, catId: cat.id, unlockedAt: nowTs });
    }
    const score = Catnu.affectionScore(state.logs, cat.id, nowTs);
    if (!score.insufficient) {
      if (score.score >= 70 && !unlocked.has(`score-70:${cat.id}`)) found.push({ id: 'score-70', catId: cat.id, unlockedAt: nowTs });
      if (score.score >= 85 && !unlocked.has(`score-85:${cat.id}`)) found.push({ id: 'score-85', catId: cat.id, unlockedAt: nowTs });
    }
    const days = Catnu.daysTogether(cat.homeDate, nowTs);
    if (days !== null) {
      [[100, 'days-100'], [365, 'days-365'], [500, 'days-500'], [1000, 'days-1000']].forEach(([n, id]) => {
        if (days >= n && !unlocked.has(`${id}:${cat.id}`)) found.push({ id, catId: cat.id, unlockedAt: nowTs });
      });
    }
  }

  if (state.streak.best >= 7 && !unlocked.has('streak-7:')) found.push({ id: 'streak-7', catId: null, unlockedAt: nowTs });
  if (state.streak.best >= 30 && !unlocked.has('streak-30:')) found.push({ id: 'streak-30', catId: null, unlockedAt: nowTs });

  return found;
};

function seedFromDate(dateStr) {
  let h = 0;
  for (let i = 0; i < dateStr.length; i++) h = (h * 31 + dateStr.charCodeAt(i)) >>> 0;
  // avalanche mix (murmur3-style finalizer) — without this, adjacent YYYY-MM-DD strings
  // (which differ only in the last digit on 9 of 10 days) produce seeds that differ by ~1,
  // so pool picks would visibly "walk" by one slot per day instead of varying day to day.
  h ^= h >>> 16; h = Math.imul(h, 0x45d9f3b) >>> 0; h ^= h >>> 13;
  return h >>> 0; // ^= yields a signed Int32 result — re-normalize to unsigned before returning
}
function pick(arr, seed) { return arr[seed % arr.length]; }

function buildQuestForCategory(category, cat, logs, dateStr, seed, nowTs) {
  if (category === 'universal') {
    const text = pick(Catnu.UNIVERSAL_QUEST_POOL, seed);
    return { id: `${dateStr}-${cat.id}-u${seed}`, text, catId: cat.id, source: 'universal', done: false };
  }
  if (category === 'data') {
    let best = null, bestN = Infinity, fallback = null;
    for (const action of Catnu.ACTIONS) {
      const r = Catnu.actionCorrelation(logs, cat.id, action.id, nowTs);
      if (r.P_a !== null && (best === null || r.P_a > best.P_a)) best = { action, P_a: r.P_a };
      if (r.n < bestN) { bestN = r.n; fallback = action; }
    }
    if (best) return { id: `${dateStr}-${cat.id}-d`, text: `今日做多次 ${best.action.label}`, catId: cat.id, source: 'data', done: false };
    return { id: `${dateStr}-${cat.id}-d`, text: `試下 ${fallback.label}，收集數據`, catId: cat.id, source: 'data', done: false };
  }
  const breed = Catnu.BREEDS.find(b => b.id === cat.breedId);
  const rule = breed && breed.breedRules.find(r => r.when === 'noRecentAction');
  if (rule) return { id: `${dateStr}-${cat.id}-b`, text: rule.text, catId: cat.id, source: 'breed', done: false };
  if (breed && breed.mixedBreed) {
    const text = pick(breed.approachGuide, seed);
    return { id: `${dateStr}-${cat.id}-b`, text, catId: cat.id, source: 'breed', done: false };
  }
  const text = pick(Catnu.UNIVERSAL_QUEST_POOL, seed + 3);
  return { id: `${dateStr}-${cat.id}-b`, text, catId: cat.id, source: 'universal', done: false };
}

Catnu.generateDailyQuests = function generateDailyQuests(dateStr, cats, logs, nowTs) {
  const seed = seedFromDate(dateStr);
  const CATEGORIES = ['universal', 'data', 'breed'];
  const quests = [];
  for (let slot = 0; slot < 3; slot++) {
    const cat = cats[(seed + slot) % cats.length];
    // slot*7 is coprime with CATEGORIES.length (3), guaranteeing each category appears
    // exactly once per day. The 'data'/'breed' branches below rely on that — their quest
    // ids have no per-slot suffix, so they'd collide if this guarantee ever broke (e.g.
    // CATEGORIES growing to a length sharing a factor with 7, or slot*7 being changed).
    const category = CATEGORIES[(seed + slot * 7) % CATEGORIES.length];
    quests.push(buildQuestForCategory(category, cat, logs, dateStr, seed + slot, nowTs));
  }
  return quests;
};

function groomingNeedFor(breedId) {
  return Catnu.GROOMING_NEED[breedId] != null ? Catnu.GROOMING_NEED[breedId] : 35;
}

const QUIZ_REASON_DIMS = [
  { key: 'clingy', high: n => `${n}黐人度高，啱你想要成日跟前跟後嘅陪伴感。`, low: n => `${n}性格獨立，唔會日日纏住你，啱你想要嘅自由度。` },
  { key: 'active', high: n => `${n}活躍愛玩，配合到你想俾佢郁嘅生活模式。`, low: n => `${n}性格恬靜，啱你想要嘅慢活相處節奏。` },
  { key: 'holdOk', high: n => `${n}接受被抱程度高，啱你想要多啲身體接觸。`, low: n => `${n}唔太受抱，啱你想俾佢多啲自主空間。` },
  { key: 'vocal', high: n => `${n}比較愛叫，會主動同你「講嘢」。`, low: n => `${n}比較文靜少叫，啱你想要安靜嘅相處。` },
];

function quizReason(breed, desired) {
  if (breed.mixedBreed || !breed.traits) return `${breed.name}性格靠實際相處摸底，唔受品種刻板定型限制，最夾隨心養育嘅心態。`;
  // pick THIS breed's own closest-matching dimension (not a shared `desired` threshold check)
  // so two similarly-scoring breeds in the same top-3 don't read as copy-pasted text.
  let best = null;
  for (const d of QUIZ_REASON_DIMS) {
    const gap = Math.abs(breed.traits[d.key] - desired[d.key]);
    if (best === null || gap < best.gap) best = { dim: d, gap, val: breed.traits[d.key] };
  }
  return best.val >= 55 ? best.dim.high(breed.name) : best.dim.low(breed.name);
}

Catnu.scoreAllBreeds = function scoreAllBreeds(answers, opts) {
  opts = opts || {};
  const desired = { clingy: 50, active: 50, holdOk: 50, vocal: 50 };
  let groomTolerance = 55, beginner = false, budgetLow = false;

  Catnu.QUIZ_QUESTIONS.forEach((q, i) => {
    const opt = q.options[answers[i]];
    if (!opt) return;
    for (const key of Object.keys(opt.delta || {})) {
      desired[key] = Math.max(0, Math.min(100, desired[key] + opt.delta[key]));
    }
    if (opt.groomTolerance != null) groomTolerance = opt.groomTolerance;
    if (opt.beginner) beginner = true;
    if (opt.budgetLow) budgetLow = true;
  });

  const scored = Catnu.BREEDS.map(breed => {
    if (breed.mixedBreed) {
      return { breed, score: 60 + (budgetLow ? 15 : 0), reason: '性格靠實際相處摸底，唔受品種刻板定型限制，加上養育成本通常較低。' };
    }
    const dims = ['clingy', 'active', 'holdOk', 'vocal'];
    let diff = 0;
    for (const d of dims) diff += Math.abs(breed.traits[d] - desired[d]);
    let score = 100 - diff / dims.length;

    score -= Math.abs(groomingNeedFor(breed.id) - groomTolerance) * 0.15;
    if (beginner && breed.traits.active > 70) score -= 10;
    if (beginner && groomingNeedFor(breed.id) > 70) score -= 8;

    if (opts.mode === 'addCat') {
      score += ((breed.multiCatFriendly - 50) / 50) * 15;
      if ((opts.existingCatNegativeRate || 0) > 0.4) {
        score += ((50 - breed.traits.active) / 50) * 10 + ((50 - breed.traits.clingy) / 50) * 5;
      }
    }

    score = Math.max(0, Math.min(100, score));
    return { breed, score, reason: quizReason(breed, desired) };
  });

  scored.sort((a, b) => b.score - a.score);
  return scored;
};

Catnu.matchQuiz = function matchQuiz(answers, opts) {
  return Catnu.scoreAllBreeds(answers, opts).slice(0, 3);
};

function defaultState() {
  return {
    schemaVersion: 2,
    cats: [],

    milestones: [],
    customActions: [],

}

Catnu.Store = {
  load() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    try {
      const parsed = JSON.parse(raw);
      // version-dispatch：v1 自動升 v2（Catnu.migrateState），未識嘅版本先至 reset
      const migrated = Catnu.migrateState(parsed);
      return migrated || defaultState();
    } catch (e) {
      console.warn('Catnu.Store.load: corrupt localStorage data, resetting to default', e);
      return defaultState();
    }
  },
  save(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  },
};

function spawnBurst(fromEl, neg) {
  if (!fromEl || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = fromEl.getBoundingClientRect();
  const icons = neg ? ['💜', '🐾', '💜', '🐾', '💜'] : ['🐾', '💗', '🐾', '✨', '💗', '🐾', '💛', '🐾'];
  icons.forEach((ic, i) => {
    const s = document.createElement('span');
    s.className = 'burst';
    s.textContent = ic;
    const ang = Math.PI * (i / (icons.length - 1)) + Math.PI;
    s.style.left = (r.left + r.width / 2 - 11) + 'px';
    s.style.top = r.top + 'px';
    s.style.setProperty('--dx', (Math.cos(ang) * (60 + Math.random() * 60)) + 'px');
    s.style.setProperty('--dy', (Math.sin(ang) * (55 + Math.random() * 65) - 25) + 'px');
    s.style.setProperty('--r', (Math.random() * 90 - 45) + 'deg');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1050);
  });
}

    .concat((log.reactions || []).map(id => { const r = Catnu.REACTIONS.find(x => x.id === id); return r ? r.label : null; }))
    .filter(Boolean)
    .map(s => s.replace(/^\S+\s/, ''));
  if (!names.length) return '淨係打咗個卡';

// 每日提醒 .ics（v1 冇 backend 做唔到真 push——用行事曆 recurring event 代替，一次 set 日日彈）
function downloadReminderICS() {
  const pad = n => String(n).padStart(2, '0');
  const d = new Date();
  d.setDate(d.getDate() + 1); // 由聽日開始
  const dtstart = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T210000`; // 每晚 9 點（floating local time）
  const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//catnu//daily-reminder//ZH',
    'BEGIN:VEVENT',
    'UID:catnu-daily-reminder-' + Date.now() + '@catnu',
    'DTSTAMP:' + stamp,
    'DTSTART:' + dtstart,
    'RRULE:FREQ=DAILY',
    'SUMMARY:🐾 同貓貓修行：記低今日相處一刻',
    'DESCRIPTION:開返「貓奴修行」記低今日互動＋完成 3 個任務保住 streak 🔥',
    'URL:https://catnu-app.vercel.app',
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:🐾 貓奴修行時間', 'TRIGGER:-PT0M', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'catnu-daily-reminder.ics';
  a.click();
  URL.revokeObjectURL(url);
  Catnu.showToast('📅 開個檔案加入行事曆，晚晚 9 點提你');
}

function sourceLabel(source) {
  if (source === 'data') return '根據你嘅分析數據生成';
  if (source === 'breed') return '根據品種特性生成';
  return '通用溝貓任務';
}

function renderShellStreak(state) {
  const b = document.querySelector('.tilehead .streak b');
  if (b) b.textContent = `🔥 ${state.streak.current}`;
}

function renderQuests(state) {
  const el = document.getElementById('tab-quests');
  if (!state.cats.length) {
    el.innerHTML = '<div class="card" style="text-align:center;padding:30px 16px"><div style="font-size:36px;margin-bottom:10px">🐾</div><b>未有貓貓資料</b><p style="margin-top:8px;font-size:13px;color:var(--sub)">去「檔案」page 加返隻貓先可以生成任務。</p></div>';
    return;
  }
  const today = todayStr();
  if (!state.quests[today]) {
    state.quests[today] = { catQuests: Catnu.generateDailyQuests(today, state.cats, state.logs, Date.now()) };
    Catnu.Store.save(state);
  }
  const quests = state.quests[today].catQuests;
  const doneCount = quests.filter(q => q.done).length;
  const catName = id => (state.cats.find(c => c.id === id) || {}).name || '';
  const latestMilestone = state.milestones.slice().sort((a, b) => b.unlockedAt - a.unlockedAt)[0];

  el.innerHTML = `
    <div class="card">
      <h3><span class="deco">◆</span> 今日溝貓任務<span class="tag">${doneCount}/3</span></h3>
      <div style="font-size:12px;color:var(--sub);margin:-4px 0 10px">🔥 連續 ${state.streak.current} 日 · 🏆 最佳 ${state.streak.best} 日</div>
      ${quests.map(q => `
        <div class="quest ${q.done ? 'done' : ''}" data-qid="${q.id}">
          <div class="box">${q.done ? '✓' : ''}</div>
          <div class="q">${catName(q.catId)}：${q.text}<small>${sourceLabel(q.source)}</small></div>
        </div>
      `).join('')}
      <div class="note">任務由分析引擎＋品種特性生成，日日唔同。完成晒先保得住 🔥 Streak（過咗夜 11:59 未完成會斷）。</div>
      <button class="btn ghost" type="button" id="ics-btn" style="margin-top:10px">🔔 加入每日提醒（行事曆）</button>
    </div>
    ${latestMilestone ? `
      <div class="card">
        <h3><span class="deco">◆</span> 最新里程碑</h3>
        <div class="milestone">
          <div class="big">${(Catnu.MILESTONE_META[latestMilestone.id] || {}).emoji || '🏅'}</div>
          <b>${catName(latestMilestone.catId) ? catName(latestMilestone.catId) + ' ' : ''}${(Catnu.MILESTONE_META[latestMilestone.id] || {}).label || latestMilestone.id}</b>
          <small>${new Date(latestMilestone.unlockedAt).toLocaleDateString('zh-HK')}</small>
          <div class="share" id="milestone-share-link">⤴ 生成靚卡 share 俾朋友</div>
        </div>
      </div>
    ` : ''}
  `;

  el.querySelectorAll('[data-qid]').forEach(card => {
    card.addEventListener('click', () => {
      const q = quests.find(x => x.id === card.dataset.qid);
      q.done = !q.done;
      Catnu.Store.save(state);
      if (quests.every(x => x.done)) {
        state.streak = Catnu.completeQuestsForDay(state.streak, today);
        const unlocked = Catnu.checkNewMilestones(state, Date.now());
        if (unlocked.length) state.milestones.push(...unlocked);
        Catnu.Store.save(state);
        Catnu.showToast('🔥 今日任務全部完成！Streak +1');
      }
      renderQuests(state);
      renderShellStreak(state);
    });
  });

  document.getElementById('ics-btn').addEventListener('click', downloadReminderICS);

  const shareLink = document.getElementById('milestone-share-link');
  if (shareLink) {
    shareLink.addEventListener('click', () => {
      if (typeof Catnu.shareMilestoneCard === 'function') Catnu.shareMilestoneCard(latestMilestone, state);
      else Catnu.showToast('Share 功能開發緊，下個 task 完成');
    });
  }
}

let analysisCatId = null;

function insightIcon(insight) {
  const action = Catnu.ACTIONS.find(a => a.id === insight.actionId);
  if (action) return action.label.split(' ')[0];
  return insight.type === 'positive' ? '💡' : insight.type === 'negative' ? '⚠️' : '🪄';
}

function mdBold(text) { return text.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }

function actionLabelOf(state, actionId) {
  const a = actionsForRecord(state).find(x => x.id === actionId);
  return a ? a.label : actionId;
}

function renderAnalysis(state) {
  const el = document.getElementById('tab-analysis');
  if (!state.cats.length) {
    el.innerHTML = '<div class="card" style="text-align:center;padding:30px 16px"><div style="font-size:36px;margin-bottom:10px">🐾</div><b>未有貓貓資料</b><p style="margin-top:8px;font-size:13px;color:var(--sub)">去「檔案」page 加返隻貓先可以睇分析。</p></div>';
    return;
  }
  if (!analysisCatId || !state.cats.some(c => c.id === analysisCatId)) analysisCatId = state.cats[0].id;
  const cat = state.cats.find(c => c.id === analysisCatId);
  const switcherHtml = `<div class="switcher">${state.cats.map(c => `<div class="chip ${c.id === analysisCatId ? 'sel' : ''}" data-cat="${c.id}">${c.emoji} ${c.name}</div>`).join('')}</div>`;
  const now = Date.now();
  const affection = Catnu.affectionScore(state.logs, cat.id, now);

  if (affection.insufficient) {
    el.innerHTML = `
      ${switcherHtml}
      <div class="card empty-state">
        <div class="big">🙀</div>
        <b>修行未夠，繼續記錄</b>
        <p style="margin-top:8px;font-size:13px">呢隻貓近 7 日仲未夠 5 條非中性記錄，去「記錄」page 記多幾次先會有分析結果。</p>
      </div>
    `;
    el.querySelectorAll('[data-cat]').forEach(c => c.addEventListener('click', () => { analysisCatId = c.dataset.cat; renderAnalysis(state); }));
    return;
  }

  const insights = Catnu.generateInsights(state.logs, cat, now);
  const level = Catnu.relationshipLevel(affection.score);
  const weekly = Catnu.weeklyReport(state.logs, cat.id, now);
  const dayBars = [];
  const localMidnight = new Date(now); // day buckets must follow local calendar days,
  localMidnight.setHours(0, 0, 0, 0);  // not UTC midnight — todayStr()/streak logic do the same
  for (let i = 6; i >= 0; i--) {
    const dayStart = localMidnight.getTime() - i * 86400000;
    const dayEnd = dayStart + 86400000;
    let pos = 0, neg = 0;
    state.logs.filter(l => l.catId === cat.id && l.ts >= dayStart && l.ts < dayEnd).forEach(l => {
      const p = Catnu.entryPolarity(l);
      if (p === 'positive') pos++; else if (p === 'negative') neg++;
    });
    const total = pos + neg;
    dayBars.push({ pct: total > 0 ? Math.round((pos / total) * 100) : 0, hasData: total > 0 });
  }

  el.innerHTML = `
    ${switcherHtml}
    <div class="card">
      <div class="cat-row">
        <div class="avatar">${cat.emoji}</div>
        <div class="cat-meta"><div class="name">好感度指數</div><div class="breed">近 7 日正面反應加權比率</div></div>
        <div class="score">
          <div class="num">${affection.score}</div>
          <div class="lbl">${affection.weekChange == null ? '' : (affection.weekChange >= 0 ? `↑ +${affection.weekChange}` : `↓ ${affection.weekChange}`)}</div>
        </div>
      </div>
      <div class="meter"><div style="width:${affection.score}%"></div></div>
      ${level ? `<div class="lvl-line">🏅 Lv.${level.lv} <b>${level.title}</b> ${level.emoji}<span class="lvl-next">${level.next ? `仲差 ${level.next.pointsNeeded} 分升 Lv.${level.next.lv}「${level.next.title}」` : '頂級！繼續寵佢 👑'}</span></div>` : ''}
      <div class="minibars">${dayBars.map(b => `<div class="bar ${b.hasData ? (b.pct >= 50 ? 'pos' : 'neg') : ''}" style="height:${b.hasData ? Math.max(b.pct, 8) : 4}%"></div>`).join('')}</div>
    </div>
    <div class="card">
      <h3><span class="deco">◆</span> ${cat.name}週報<span class="tag">近 7 日</span></h3>
      <div class="wk-grid">
        <div class="wk-cell"><b>${weekly.count}</b><span>互動記錄</span></div>
        <div class="wk-cell"><b>${weekly.posRate == null ? '--' : weekly.posRate + '%'}</b><span>正面率${weekly.posRateChange == null ? '' : (weekly.posRateChange >= 0 ? ` ↑+${weekly.posRateChange}` : ` ↓${weekly.posRateChange}`)}</span></div>
        <div class="wk-cell"><b style="font-size:14px;line-height:2">${weekly.topAction ? actionLabelOf(state, weekly.topAction) : '--'}</b><span>今週做得最多</span></div>
      </div>
      <button class="btn ghost" type="button" id="weekly-share" style="margin-top:12px">⤴ 生成週報靚卡</button>
    </div>
    <div class="card">
      <h3><span class="deco">◆</span> 溝貓建議</h3>
      ${insights.length ? insights.map(i => `<div class="insight"><span>${insightIcon(i)}</span><span>${mdBold(i.text)}</span></div>`).join('') : '<div class="note">暫時未有夠數據嘅發現，繼續記錄啦。</div>'}
    </div>
  `;
  const weeklyShareBtn = document.getElementById('weekly-share');
  if (weeklyShareBtn) weeklyShareBtn.addEventListener('click', () => Catnu.shareWeeklyCard(state, cat, weekly));
  el.querySelectorAll('[data-cat]').forEach(c => c.addEventListener('click', () => { analysisCatId = c.dataset.cat; renderAnalysis(state); }));
}

RENDERERS.analysis = renderAnalysis;

let quizState = null;

function closeQuiz() {
  quizState = null;
  const ov = document.getElementById('quiz-overlay');
  if (ov) ov.remove();
}

function startQuiz(state, mode) {
  quizState = {
    mode,
    existingCatId: mode === 'addCat' ? state.cats[0].id : null,
    stepIndex: mode === 'addCat' && state.cats.length > 1 ? -1 : 0,
    answers: [],
  };
  renderQuizOverlay(state);
}

function renderQuizOverlay(state) {
  let panel = document.getElementById('quiz-overlay');
  if (!panel) {
    panel = document.createElement('div');
    panel.id = 'quiz-overlay';
    panel.className = 'quiz-overlay';
    document.getElementById('app').appendChild(panel);
  }

  if (quizState.stepIndex === -1) {
    panel.innerHTML = `
      <div class="quiz-panel">
        <button class="quiz-close" id="quiz-close">✕</button>
        <h3><span class="deco">◆</span> 想幫邊隻貓搵新拍檔？</h3>
        <div class="chips">${state.cats.map(c => `<span class="chip" data-existing-cat="${c.id}">${c.emoji} ${c.name}</span>`).join('')}</div>
      </div>
    `;
    panel.querySelectorAll('[data-existing-cat]').forEach(c => c.addEventListener('click', () => {
      quizState.existingCatId = c.dataset.existingCat;
      quizState.stepIndex = 0;
      renderQuizOverlay(state);
    }));
    document.getElementById('quiz-close').addEventListener('click', closeQuiz);
    return;
  }

  if (quizState.stepIndex < Catnu.QUIZ_QUESTIONS.length) {
    const q = Catnu.QUIZ_QUESTIONS[quizState.stepIndex];
    panel.innerHTML = `
      <div class="quiz-panel">
        <button class="quiz-close" id="quiz-close">✕</button>
        <div class="note" style="margin-top:0">第 ${quizState.stepIndex + 1} / ${Catnu.QUIZ_QUESTIONS.length} 題</div>
        <h3>${q.text}</h3>
        <div class="chips">${q.options.map((opt, i) => `<span class="chip" data-answer="${i}">${opt.label}</span>`).join('')}</div>
      </div>
    `;
    panel.querySelectorAll('[data-answer]').forEach(c => c.addEventListener('click', () => {
      quizState.answers[quizState.stepIndex] = +c.dataset.answer;
      quizState.stepIndex++;
      renderQuizOverlay(state);
    }));
    document.getElementById('quiz-close').addEventListener('click', closeQuiz);
    return;
  }

  const opts = { mode: quizState.mode };
  if (quizState.mode === 'addCat') {
    const existingCat = state.cats.find(c => c.id === quizState.existingCatId);
    let pos = 0, neg = 0;
    state.logs.filter(l => l.catId === existingCat.id).forEach(l => {
      const p = Catnu.entryPolarity(l);
      if (p === 'positive') pos++; else if (p === 'negative') neg++;
    });
    const total = pos + neg;
    opts.existingCat = existingCat;
    opts.existingCatNegativeRate = total > 0 ? neg / total : 0;
  }
  const top3 = Catnu.matchQuiz(quizState.answers, opts);

  panel.innerHTML = `
    <div class="quiz-panel">
      <button class="quiz-close" id="quiz-close">✕</button>
      <h3><span class="deco">◆</span> 最夾你嘅 3 個品種</h3>
      ${top3.map((r, i) => `
        <div class="breed-card" data-result-breed="${r.breed.id}">
          <div class="bh"><span class="emoji">${r.breed.emoji}</span><span class="name">${i + 1}. ${r.breed.name}</span></div>
          <div class="bd open"><div>${r.reason}</div></div>
        </div>
      `).join('')}
      ${quizState.mode === 'addCat' ? `
        <div class="note"><b>引入新貓步驟：</b>先隔離一星期唔好直接見面，交換氣味（毛巾/床墊），再用圍欄或開細縫俾佢哋睇到但摸唔到對方，觀察雙方反應冇異常先正式見面，成個過程可以花 2-4 星期，唔好心急。</div>
      ` : ''}
    </div>
  `;
  panel.querySelectorAll('[data-result-breed]').forEach(card => card.addEventListener('click', () => {
    almanacBreedOpen.add(card.dataset.resultBreed);
    closeQuiz();
    switchTab('almanac');
  }));
  document.getElementById('quiz-close').addEventListener('click', closeQuiz);
}

// Shared by both the 檔案 tab's "⤒ 還原" control and the onboarding screen's
// (a wiped/first-run user has no cats yet, so they can't reach 檔案 at all).
function wireRestoreInput(inputEl) {
  inputEl.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (![1, 2].includes(parsed.schemaVersion) || !Array.isArray(parsed.cats) || !Array.isArray(parsed.logs)) throw new Error('bad schema');
        if (!Catnu.migrateState(parsed)) throw new Error('bad schema');
        Catnu.Store.save(parsed);
        location.reload();
      } catch (err) {
        Catnu.showToast('還原失敗：檔案格式唔啱');
      }
    };
    reader.readAsText(file);
  });
}

    const catId = b.dataset.anniSave;
    const label = document.getElementById('anni-new-label-' + catId).value.trim();

    if (!label || !date) { Catnu.showToast('填埋個名同日期先'); return; }

    cat.anniversaries.push({ id: 'a' + Date.now(), label, emoji: '💗', date });
    Catnu.Store.save(state);
    profileAnniAddingCatId = null;
    renderProfile(state);
  }));
  el.querySelectorAll('[data-anni-del]').forEach(b => b.addEventListener('click', () => {
    const [catId, annId] = b.dataset.anniDel.split(':');
    const cat = state.cats.find(c => c.id === catId);
    cat.anniversaries = (cat.anniversaries || []).filter(a => a.id !== annId);
    Catnu.Store.save(state);
    renderProfile(state);
  }));
  el.querySelectorAll('[data-cancel-edit]').forEach(b => b.addEventListener('click', () => { profileEditingCatId = null; renderProfile(state); }));
  el.querySelectorAll('[data-save-cat]').forEach(b => b.addEventListener('click', () => {
    const cat = state.cats.find(c => c.id === b.dataset.saveCat);
    el.querySelectorAll('[data-edit-field]').forEach(f => {
      const field = f.dataset.editField;
      if (field === 'neutered') cat.neutered = f.value === '' ? null : f.value === 'true';

    profileEditingCatId = null;
    renderProfile(state);
  }));
  el.querySelectorAll('[data-delete-cat]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.deleteCat;
    const cat = state.cats.find(c => c.id === id);
    if (!confirm(`確定刪除「${cat.name}」？佢嘅所有記錄都會一齊刪走，無法還原。`)) return;
    state.cats = state.cats.filter(c => c.id !== id);
    state.logs = state.logs.filter(l => l.catId !== id);
    state.milestones = state.milestones.filter(m => m.catId !== id);
    if (profileEditingCatId === id) profileEditingCatId = null;
    Catnu.Store.save(state);
    renderProfile(state);
  }));
  const addBtn = document.getElementById('add-cat-btn');
  if (addBtn) addBtn.addEventListener('click', () => { profileAdding = true; renderProfile(state); });
  const cancelAddBtn = document.getElementById('new-cat-cancel');
  if (cancelAddBtn) cancelAddBtn.addEventListener('click', () => { profileAdding = false; renderProfile(state); });
  const saveAddBtn = document.getElementById('new-cat-save');
  if (saveAddBtn) saveAddBtn.addEventListener('click', () => {
    const name = document.getElementById('new-cat-name').value.trim();

    Catnu.Store.save(state);
    profileAdding = false;
    renderProfile(state);
  });

  document.getElementById('export-btn').addEventListener('click', () => {
    const dateStr = todayStr().replace(/-/g, '');
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);

    a.click();
    URL.revokeObjectURL(url);
  });
  wireRestoreInput(document.getElementById('import-input'));
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrapCenteredText(ctx, text, cx, y, maxWidth, lineHeight) {
  let line = '', lines = [];
  for (const ch of text.split('')) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = ch; }
    else line = test;
  }
  if (line) lines.push(line);
  lines.forEach((l, i) => ctx.fillText(l, cx, y + i * lineHeight));
}

/* ── Share 卡（奶茶 clay 視覺，1080×1350 IG portrait；三款共用底框）── */

function drawShareCardBase(ctx) {
  const g = ctx.createLinearGradient(0, 0, 0, 1350);
  g.addColorStop(0, '#FFE7D6'); g.addColorStop(1, '#FFD3BE');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1350);

  // 散落爪印 pattern
  ctx.save(); ctx.globalAlpha = 0.10; ctx.fillStyle = '#B5605B';
  const paw = (x, y, s, rot) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.beginPath(); ctx.arc(0, 12 * s, 16 * s, 0, Math.PI * 2); ctx.fill();
    [[-14, -6], [0, -12], [14, -6]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(dx * s, dy * s, 7 * s, 0, Math.PI * 2); ctx.fill(); });
    ctx.restore();
  };
  [[90, 120, 2.2, -0.4], [990, 180, 1.8, 0.5], [140, 1230, 1.9, 0.3], [950, 1240, 2.4, -0.2], [540, 80, 1.5, 0.1], [70, 700, 1.6, 0.6], [1010, 720, 1.7, -0.5]].forEach(([x, y, s, r]) => paw(x, y, s, r));
  ctx.restore();

  // 白卡＋柔影
  ctx.save();
  ctx.shadowColor = 'rgba(122,74,56,.28)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 24;
  ctx.fillStyle = '#FFFDFA';
  roundRect(ctx, 110, 150, 860, 1050, 56);
  ctx.fill();
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#B99C8C';
  ctx.font = 'bold 34px "M PLUS Rounded 1c","Noto Sans TC",sans-serif';
  ctx.fillText('🐾 貓 奴 修 行 🐾', 540, 250);

  ctx.fillStyle = '#C9A78F';
  ctx.font = 'italic 30px Fraunces,serif';
  ctx.fillText("Win your cat's heart, one moment at a time.", 540, 1290);
}

  const canvas = document.createElement('canvas');
  canvas.width = 1080; canvas.height = 1350;
  const ctx = canvas.getContext('2d');
  drawShareCardBase(ctx);
  return { canvas, ctx };
}

Catnu.shareMilestoneCard = function shareMilestoneCard(milestone, state) {
  const { canvas, ctx } = newShareCanvas();
  const cat = state.cats.find(c => c.id === milestone.catId);
  const meta = Catnu.MILESTONE_META[milestone.id] || {};
  const homeDate = (cat && cat.homeDate) ? new Date(cat.homeDate).getTime() : state.settings.createdAt;
  const dayN = Math.max(1, Math.floor((milestone.unlockedAt - homeDate) / 86400000) + 1);

  ctx.font = '170px sans-serif';
  ctx.fillStyle = '#5C4638';
  ctx.fillText(meta.emoji || '🏅', 540, 560);

  ctx.font = 'bold 62px "M PLUS Rounded 1c","Noto Sans TC",sans-serif';
  ctx.fillStyle = '#E0754F';
  wrapCenteredText(ctx, `${cat ? cat.name + ' ' : ''}${meta.label || milestone.id}`, 540, 700, 740, 74);

  ctx.font = '34px "Noto Sans TC",sans-serif';
  ctx.fillStyle = '#A98D7C';
  ctx.fillText(`${new Date(milestone.unlockedAt).toLocaleDateString('zh-HK')} · 相處第 ${dayN} 日`, 540, 850);

  ctx.font = '46px sans-serif';
  ctx.fillText('💗 💛 💗', 540, 990);

  downloadCanvas(canvas, `catnu-milestone-${milestone.id}-${todayStr()}.png`);
};

Catnu.shareWeeklyCard = function shareWeeklyCard(state, cat, weekly) {
  const { canvas, ctx } = newShareCanvas();

  ctx.font = 'bold 54px "M PLUS Rounded 1c","Noto Sans TC",sans-serif';
  ctx.fillStyle = '#7A4A38';
  ctx.fillText(`${cat.emoji} ${cat.name}嘅一週修行報告`, 540, 400);

  ctx.font = 'italic 900 190px Fraunces,serif';
  ctx.fillStyle = '#E0754F';
  ctx.fillText(weekly.posRate == null ? '--' : `${weekly.posRate}%`, 540, 640);

  ctx.font = 'bold 36px "Noto Sans TC",sans-serif';
  ctx.fillStyle = '#A98D7C';
  ctx.fillText('本週正面反應率' + (weekly.posRateChange == null ? '' : (weekly.posRateChange >= 0 ? `（↑ +${weekly.posRateChange}）` : `（↓ ${weekly.posRateChange}）`)), 540, 720);

  ctx.font = '38px "Noto Sans TC",sans-serif';
  ctx.fillStyle = '#5C4638';
  ctx.fillText(`本週互動 ${weekly.count} 次`, 540, 850);
  if (weekly.topAction) ctx.fillText(`做得最多：${actionLabelOf(state, weekly.topAction)} ×${weekly.topActionCount}`, 540, 920);

  const a = Catnu.affectionScore(state.logs, cat.id, Date.now());
  const level = a.insufficient ? null : Catnu.relationshipLevel(a.score);
  if (level) {
    ctx.font = 'bold 40px "M PLUS Rounded 1c","Noto Sans TC",sans-serif';
    ctx.fillStyle = '#E0754F';
    ctx.fillText(`🏅 Lv.${level.lv} ${level.title} ${level.emoji}`, 540, 1030);
  }

  downloadCanvas(canvas, `catnu-weekly-${cat.id}-${todayStr()}.png`);
};

Catnu.shareAnniversaryCard = function shareAnniversaryCard(state, cat, anni) {
  const { canvas, ctx } = newShareCanvas();
  const dayN = Catnu.daysTogether(cat.homeDate, Date.now());

  ctx.font = '170px sans-serif';
  ctx.fillText(anni.emoji || '🎉', 540, 560);

  ctx.font = 'bold 64px "M PLUS Rounded 1c","Noto Sans TC",sans-serif';
  ctx.fillStyle = '#E0754F';
  const yearsBit = anni.key === 'birthday' ? `${anni.years} 歲生日` : anni.years ? `${anni.label}（${anni.years} 周年）` : anni.label;
  wrapCenteredText(ctx, `${cat.name}嘅${yearsBit}`, 540, 700, 740, 76);

  ctx.font = '36px "Noto Sans TC",sans-serif';
  ctx.fillStyle = '#A98D7C';
  ctx.fillText(anni.date, 540, 840);
  if (dayN) ctx.fillText(`我哋已經一齊 ${dayN} 日喇`, 540, 910);

  ctx.font = '46px sans-serif';
  ctx.fillText('🎂 💗 🎈', 540, 1030);

  downloadCanvas(canvas, `catnu-anniversary-${cat.id}-${todayStr()}.png`);
};
